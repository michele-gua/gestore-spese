<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spese</title><meta name="theme-color" content="#4f46e5"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%236366f1%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%234338ca%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2222%22%20fill=%22url(%23g)%22/%3E%3Ccircle%20cx=%2250%22%20cy=%2250%22%20r=%2231%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2250%22%20cy=%2250%22%20r=%2231%22%20fill=%22none%22%20stroke=%22%23c7d2fe%22%20stroke-width=%222.5%22/%3E%3Cpath%20d=%22M63%2038.5A15.5%2015.5%200%201%200%2063%2061.5%22%20fill=%22none%22%20stroke=%22%234338ca%22%20stroke-width=%226.5%22%20stroke-linecap=%22round%22/%3E%3Cpath%20d=%22M33.5%2045.5H57M33.5%2055H57%22%20stroke=%22%234338ca%22%20stroke-width=%225%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spese"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#161a20;--mu:#6b7280;--ac:#4f46e5;--ok:#16a34a;--ko:#dc2626;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mu:#9aa3b2;--ac:#818cf8;--bd:#2b303a}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mu:#9aa3b2;--ac:#818cf8;--bd:#2b303a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:13px}.neg{color:var(--ko)}.pos{color:var(--ok)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}button.x{background:transparent;color:var(--ko);padding:4px 8px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:transparent;color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:12px 4px;font-size:12px}nav button.on{color:var(--ac);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--ac);margin-top:4px}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-right:4px;white-space:nowrap}
.line{display:grid;grid-template-columns:1fr 70px 100px 24px;gap:6px;margin-bottom:6px}.line input,.line select{padding:7px;font-size:13px}
#msg{font-size:13px;margin:8px 0;color:var(--mu)}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const CATS=["Alimentari","Ristoranti","Trasporti","Casa","Salute","Svago","Abbonamenti","Shopping","Altro"];
const PROMPT=`Sei un lettore di scontrini italiani. Analizza l'immagine e rispondi SOLO con JSON valido, senza markdown: {"negozio":string,"data":"YYYY-MM-DD" o null,"righe":[{"nome":string,"prezzo":number,"categoria":una tra ${JSON.stringify(CATS)}}],"totale":number}. I prezzi sono in euro, positivi. Sconti come riga negativa. Se illeggibile, righe=[].`;
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const eur=n=>(n<0?"-":"")+Math.abs(n).toFixed(2).replace(".",",")+" €";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Math.random().toString(36).slice(2,10);
let S={acc:{cash:0,bank:0},exp:[],rec:[]},tab="home",draft=null,msg="",month=today().slice(0,7);
try{const r=localStorage.getItem("spese_v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const MN={cash:"Contanti",bank:"Bancomat"};
function addDate(s,f,anchor){const d=new Date(s+"T12:00:00");
 if(f==="w")d.setDate(d.getDate()+7);
 else{const dd=anchor||d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(f==="y"?12:1));d.setDate(Math.min(dd,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function apply(e,sign){ // sign +1 = register, -1 = undo
 if(e.type==="in")S.acc[e.method]+=sign*e.amount;
 else if(e.payer==="me")S.acc[e.method]-=sign*e.amount}
function runRec(){let n=0;S.rec.forEach(r=>{let g=0;while(r.next<=today()&&g++<60){
 const e={id:uid(),type:"out",date:r.next,desc:r.desc,amount:r.amount,cat:r.cat,method:r.method,payer:"me",payerName:"",owe:false,rec:true};
 S.exp.push(e);apply(e,1);r.next=addDate(r.next,r.freq,r.day);n++}});
 if(n){save();msg=n+" spesa/e ricorrente/i registrata/e in automatico"}}
if(!(ls("spese_sync")==="1"))runRec();
function newForm(){return{type:"out",date:today(),desc:"",amount:"",cat:"Alimentari",method:"cash",payer:"me",payerName:"",owe:false,lines:[]}}
function go(t){tab=t;if(t==="add"&&!draft)draft=newForm();render()}
function setF(k,v,rr){draft[k]=v;if(rr){const y=window.scrollY;render();window.scrollTo(0,y)}}
function nav(){document.getElementById("nav").innerHTML=[["home","Home"],["add","＋ Aggiungi"],["rec","Ricorrenti"],["hist","Storico"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function sel(opts,cur,fn){return `<select onchange="${fn}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===cur?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`}
const catOpts=CATS.map(c=>[c,c]);
function render(){nav();const a=document.getElementById("app");
 a.innerHTML=({home:vHome,add:vAdd,rec:vRec,hist:vHist})[tab]();window.scrollTo(0,0);msg=""}
function vHome(){
 const mm=S.exp.filter(e=>e.type==="out"&&e.date.startsWith(month));
 const tot=mm.reduce((s,e)=>s+e.amount,0),mine=mm.filter(e=>e.payer==="me").reduce((s,e)=>s+e.amount,0);
 const by={};mm.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=rows[0]?rows[0][1]:1;
 const debt=S.exp.filter(e=>e.owe&&!e.paid);const dt=debt.reduce((s,e)=>s+e.amount,0);
 return `<h1>💸 Le mie spese</h1><div id="msg">${esc(msg)}</div>
 <div class="grid2">${["cash","bank"].map(k=>`<div class="card"><div class="mu">${k==="cash"?"💶":"💳"} ${MN[k]}</div><div class="big ${S.acc[k]<0?"neg":""}">${eur(S.acc[k])}</div><button class="g" style="margin-top:6px;padding:4px 8px;font-size:12px" onclick="editBal('${k}')">modifica saldo</button></div>`).join("")}</div>
 ${dt>0?`<div class="card"><div class="mu">Da restituire a chi ha pagato per te</div><div class="big neg">${eur(dt)}</div><div class="mu">Vai in Storico e premi "saldato" quando restituisci</div></div>`:""}
 <h2>Mese <input type="month" value="${month}" style="width:auto;display:inline-block;margin-left:6px" onchange="month=this.value;render()"></h2>
 <div class="card"><div class="mu">Totale speso</div><div class="big">${eur(tot)}</div><div class="mu">di cui pagato da te: ${eur(mine)} · da altri: ${eur(tot-mine)}</div></div>
 <div class="card">${rows.length?rows.map(([c,v])=>`<div style="margin-bottom:8px"><div class="row"><span>${esc(c)}</span><span style="text-align:right">${eur(v)}</span></div><div class="bar" style="width:${Math.max(3,v/mx*100)}%"></div></div>`).join(""):'<span class="mu">Nessuna spesa questo mese</span>'}</div>${vSet()}`}
function vSet(){const p=ls("spese_prov")||"gemini",g=p==="gemini";return `<h2>Impostazioni</h2><div class="card"><div class="mu">🤖 Scanner scontrini</div><label>Provider</label><select onchange="setProv(this.value)"><option value="gemini" ${g?"selected":""}>Google Gemini (AI Studio, free tier)</option><option value="anthropic" ${g?"":"selected"}>Anthropic Claude</option></select><label>Chiave API</label><input id="ak" type="password" placeholder="${g?"AIza...":"sk-ant-..."}" value="${esc(ls("spese_key_"+p)||"")}">${g?vGModel():`<label>Modello (vuoto = default)</label><input id="mo" placeholder="claude-sonnet-5-5" value="${esc(ls("spese_model_"+p)||"")}">`}<div class="row" style="margin-top:10px"><button onclick="saveKey()">Salva</button><button class="g" onclick="rmKey()">Rimuovi chiave</button></div><div class="mu" style="margin-top:6px">La chiave resta solo in questo browser. ${g?"Chiave gratis su aistudio.google.com/apikey":"Usa una chiave con limite di spesa basso."}</div></div><div class="card"><div class="mu">💾 Backup (i dati vivono solo in questo browser)</div><div class="row" style="margin-top:6px"><button class="g" onclick="exportD()">Esporta</button><button class="g" onclick="document.getElementById('imp').click()">Importa</button></div><input id="imp" type="file" accept="application/json,.json" style="display:none" onchange="importD(this)"></div>${vSync()}`}
function setProv(v){try{localStorage.setItem("spese_prov",v)}catch(e){}render()}
// Limiti free tier Gemini (indicativi, misurati a settembre 2026: Google non li pubblica più, vanno per progetto e modello)
const GM=[
 {id:"gemini-3.5-flash-lite",n:"Gemini 3.5 Flash-Lite",d:500,m:15,t:"consigliato"},
 {id:"gemini-3.1-flash-lite",n:"Gemini 3.1 Flash-Lite",d:500,m:15,t:""},
 {id:"gemini-3.8-flash",n:"Gemini 3.8 Flash",d:20,m:5,t:"più preciso"},
 {id:"gemini-3.6-flash",n:"Gemini 3.6 Flash",d:20,m:5,t:""},
 {id:"gemini-3-flash-preview",n:"Gemini 3 Flash (preview)",d:20,m:5,t:""}];
const gModel=()=>ls("spese_model_gemini")||GM[0].id;
// Contatore scansioni fatte da questa app (la quota Google si azzera a mezzanotte ora del Pacifico)
const ptDay=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"});
function useLoad(){try{return JSON.parse(ls("spese_use")||"{}")||{}}catch(e){return{}}}
function useBump(model){const u=useLoad(),k=ptDay(Date.now());u[k]=u[k]||{};u[k][model]=(u[k][model]||0)+1;
 const keep=[];for(let i=0;i<14;i++)keep.push(ptDay(Date.now()-i*864e5));Object.keys(u).forEach(d=>{if(!keep.includes(d))delete u[d]});
 try{localStorage.setItem("spese_use",JSON.stringify(u))}catch(e){}
 const el=document.getElementById("uline");if(el)el.innerHTML=gUse(model)}
function useGet(model){const u=useLoad();let d=0,w=0;
 for(let i=0;i<7;i++){const n=(u[ptDay(Date.now()-i*864e5)]||{})[model]||0;w+=n;if(i===0)d=n}
 return{d,w}}
function gUse(model){const u=useGet(model),x=GM.find(y=>y.id===model);
 return `Usate da questa app: oggi <b>${u.d}${x?" / "+x.d:""}</b> · ultimi 7 giorni <b>${u.w}</b>${x&&u.d>=x.d?" · ⚠️ limite di oggi raggiunto":""}`}
function gLim(id){const x=GM.find(y=>y.id===id);
 const head=ls("spese_prov")==="anthropic"||!id?"":gUse(id)+"<br>";
 if(!x)return head+"Modello personalizzato: i limiti non sono noti, controllali su aistudio.google.com/rate-limit";
 return head+`Piano gratuito: circa <b>${x.d}</b> scansioni al giorno · ${x.m} al minuto · al massimo ~${x.d*7} a settimana. Non esiste un tetto settimanale vero e proprio: conta solo quello giornaliero, che si azzera a mezzanotte ora del Pacifico (circa le 09:00 in Italia). Ogni scansione = 1 richiesta.<br>Valori indicativi (settembre 2026): Google non li pubblica più e possono variare per progetto. Il contatore conta solo ciò che fai da questa app, su questo dispositivo.`}
function vGModel(){const cur=gModel(),known=GM.some(x=>x.id===cur);
 return `<label>Modello Gemini</label><select id="mosel" onchange="gmChange(this.value)">${GM.map(x=>`<option value="${x.id}" ${x.id===cur?"selected":""}>${x.n} · ${x.d}/giorno${x.t?" · "+x.t:""}</option>`).join("")}<option value="__custom" ${known?"":"selected"}>Altro (scrivi il nome)…</option></select><input id="mo" placeholder="gemini-..." value="${known?"":esc(cur)}" style="margin-top:6px;${known?"display:none":""}" oninput="document.getElementById('glim').innerHTML=gLim(this.value.trim())"><div class="mu" id="glim" style="margin-top:6px">${gLim(cur)}</div>`}
function gmChange(v){const mo=document.getElementById("mo"),c=v==="__custom";mo.style.display=c?"":"none";
 if(c){mo.value="";mo.focus();document.getElementById("glim").innerHTML=gLim("")}
 else{try{localStorage.setItem("spese_model_gemini",v)}catch(e){}document.getElementById("glim").innerHTML=gLim(v)}}
function saveKey(){const p=ls("spese_prov")||"gemini";try{localStorage.setItem("spese_key_"+p,document.getElementById("ak").value.trim());
 let m=document.getElementById("mo").value.trim();if(p==="gemini"){const s=document.getElementById("mosel").value;if(s!=="__custom")m=s}
 localStorage.setItem("spese_model_"+p,m);msg="Salvato ✅"}catch(e){msg="⚠️ Impossibile salvare"}render()}
function rmKey(){const p=ls("spese_prov")||"gemini";try{localStorage.removeItem("spese_key_"+p)}catch(e){}msg="Chiave rimossa";render()}
function exportD(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="spese-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
function importD(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.acc||!Array.isArray(j.exp)||!Array.isArray(j.rec))throw 0;if(!confirm("Sostituire TUTTI i dati attuali con il backup?"))return;S=j;save();msg="Backup importato ✅";render()}catch(e){alert("File di backup non valido")}};r.readAsText(f)}
function editBal(k){const v=prompt("Saldo attuale "+MN[k]+" (€):",S.acc[k].toFixed(2));if(v===null)return;const n=parseFloat(v.replace(",","."));if(!isNaN(n)){S.acc[k]=n;save();render()}}
function vAdd(){const f=draft,L=f.lines;
 return `<h1>Nuova voce</h1><div id="msg">${esc(msg)}</div>
 <div class="card"><div class="mu">📷 Scansiona scontrino</div><input id="file" type="file" accept="image/*" capture="environment" style="margin-top:6px" onchange="scan(this)"><div id="scanst" class="mu" style="margin-top:6px"></div>${(ls("spese_prov")||"gemini")==="gemini"?`<div id="uline" class="mu" style="margin-top:4px">${gUse(gModel())}</div>`:""}</div>
 <div class="card"><div class="seg"><button class="${f.type==="out"?"on":""}" onclick="setF('type','out',1)">Spesa</button><button class="${f.type==="in"?"on":""}" onclick="setF('type','in',1)">Entrata</button></div>
 <label>Descrizione / negozio</label><input value="${esc(f.desc)}" oninput="draft.desc=this.value">
 <div class="row"><div><label>Data</label><input type="date" value="${f.date}" onchange="draft.date=this.value"></div>
 ${L.length?"":`<div><label>Importo (€)</label><input inputmode="decimal" value="${esc(f.amount)}" oninput="draft.amount=this.value"></div>`}</div>
 ${L.length?`<label>Righe scontrino (nome · prezzo · categoria)</label>${L.map((l,i)=>`<div class="line"><input value="${esc(l.name)}" oninput="draft.lines[${i}].name=this.value"><input inputmode="decimal" value="${esc(l.price)}" oninput="draft.lines[${i}].price=this.value"><select onchange="draft.lines[${i}].cat=this.value">${CATS.map(c=>`<option ${c===l.cat?"selected":""}>${c}</option>`).join("")}</select><button class="x" onclick="draft.lines.splice(${i},1);render()">✕</button></div>`).join("")}<div class="mu">Totale: <b>${eur(L.reduce((s,l)=>s+(parseFloat(String(l.price).replace(",","."))||0),0))}</b> · verrà diviso per categoria</div>`:`<label>Categoria</label>${sel(catOpts,f.cat,"draft.cat=this.value")}`}
 <label>${f.type==="in"?"Dove arrivano i soldi":"Metodo di pagamento"}</label><div class="seg"><button class="${f.method==="cash"?"on":""}" onclick="setF('method','cash',1)">💶 Contanti</button><button class="${f.method==="bank"?"on":""}" onclick="setF('method','bank',1)">💳 Bancomat</button></div>
 ${f.type==="out"?`<label>Chi ha pagato?</label><div class="seg"><button class="${f.payer==="me"?"on":""}" onclick="setF('payer','me',1)">Io</button><button class="${f.payer==="other"?"on":""}" onclick="setF('payer','other',1)">Un altro</button></div>
 ${f.payer==="other"?`<label>Chi? (nome)</label><input value="${esc(f.payerName)}" oninput="draft.payerName=this.value"><label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" style="width:auto" ${f.owe?"checked":""} onchange="draft.owe=this.checked"> Devo restituirgli i soldi</label><div class="mu">Non scala nessun saldo tuo.</div>`:`<div class="mu" style="margin-top:6px">Verrà scalato da: <b>${MN[f.method]}</b></div>`}`:""}
 <button style="width:100%;margin-top:12px" onclick="submit()">Salva</button></div>
 ${f.type==="out"?`<div class="card"><div class="mu">🔁 Rendi ricorrente</div><div class="row" style="margin-top:6px">${sel([["","No"],["w","Ogni settimana"],["m","Ogni mese"],["y","Ogni anno"]],f.freq||"","draft.freq=this.value")}</div><div class="mu">Si registra da sola alle scadenze (solo pagate da te).</div></div>`:""}`}
function num(v){return parseFloat(String(v).replace(",","."))}
function submit(){const f=draft;let ok=false;
 if(f.type==="out"&&f.payer==="other"&&!f.payerName.trim()){alert("Scrivi chi ha pagato");return}
 const base={type:f.type,date:f.date,method:f.method,payer:f.type==="in"?"me":f.payer,payerName:f.payerName.trim(),owe:f.type==="out"&&f.payer==="other"&&f.owe,paid:false};
 if(f.lines.length){const g={};f.lines.forEach(l=>{const p=num(l.price);if(p>0)g[l.cat]=(g[l.cat]||0)+p});
  Object.entries(g).forEach(([c,v])=>{const e={...base,id:uid(),desc:f.desc||"Scontrino",amount:Math.round(v*100)/100,cat:c};S.exp.push(e);apply(e,1);ok=true})}
 else{const v=num(f.amount);if(!(v>0)){alert("Inserisci un importo valido");return}
  const e={...base,id:uid(),desc:f.desc||(f.type==="in"?"Entrata":f.cat),amount:v,cat:f.type==="in"?"Entrata":f.cat};S.exp.push(e);apply(e,1);ok=true;
  if(f.freq&&f.type==="out"&&f.payer==="me"){const d=new Date(f.date+"T12:00:00");S.rec.push({id:uid(),desc:e.desc,amount:v,cat:f.cat,method:f.method,freq:f.freq,day:d.getDate(),next:addDate(f.date,f.freq,d.getDate())})}}
 if(ok){save();draft=null;msg="Salvato ✅";tab="hist";render()}}
async function scan(inp){const st=document.getElementById("scanst"),file=inp.files[0];if(!file)return;
 st.textContent="Leggo lo scontrino…";
 try{const prov=ls("spese_prov")||"gemini",key=ls("spese_key_"+prov);if(!key)throw new Error("Imposta prima la chiave API: Home → Impostazioni");
  const blob=await shrink(file);const b64=await new Promise(rs=>{const fr=new FileReader();fr.onload=()=>rs(fr.result.split(",")[1]);fr.readAsDataURL(blob)});
  let t;
  if(prov==="gemini"){

function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Immagine non valida")),"image/jpeg",.85)};
 img.onerror=()=>rej(new Error("Immagine non valida"));img.src=u})}

function delE(id){const e=S.exp.find(x=>x.id===id);if(e&&confirm("Eliminare? Il saldo verrà ripristinato.")){apply(e,-1);S.exp=S.exp.filter(x=>x.id!==id);save();render()}}

 const m=/banc|carta/i.test(k)?"bank":"cash";S.acc[m]-=e.amount;e.paid=true;save();render()}

const G_CLIENT_ID="578231343600-4dg6vdrhnf3q4gnq9kpudnmcqlha5svb.apps.googleusercontent.com";
const G_SCOPE="https://www.googleapis.com/auth/drive.file email";
const G_DIR="mspeseg",G_FILE="backup.spese";
const blank=()=>({acc:{cash:0,bank:0},exp:[],rec:[]});
var gTok=null,gExp=0,gEmail="",gClient=null,gFile=null,gFolder=null,gSt="",cpT,gFirst=true,gCb=()=>{},gEb=()=>{};
function persist(){try{localStorage.setItem("spese_v1",JSON.stringify(S))}catch(e){}}
function save(){S._ts=Date.now();persist();clearTimeout(cpT);cpT=setTimeout(()=>gPush().then(()=>{gSt=""}).catch(e=>{gSt=e.message;console.error("sync",e)}),800)}
function loadScript(u){return new Promise((rs,rj)=>{const s=document.createElement("script");s.src=u;s.onload=rs;s.onerror=()=>rj(new Error("Impossibile caricare Google"));document.head.appendChild(s)})}
function gAuth(prompt){return new Promise((rs,rj)=>{
 const t=setTimeout(()=>rj(new Error("Sessione scaduta: premi Riconnetti")),prompt===""?10000:120000);
 gCb=r=>{clearTimeout(t);if(r.error)rj(new Error(r.error));else{gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;rs()}};
 gEb=e=>{clearTimeout(t);rj(new Error(e.type==="popup_closed"?"Accesso annullato":"Sessione scaduta: premi Riconnetti"))};
 gClient.requestAccessToken({prompt})})}
async function gApi(url,opt){opt=opt||{};if(!gTok||Date.now()>gExp)await gAuth("");
 const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{authorization:"Bearer "+gTok})}));
 if(r.status===401){gTok=null;throw new Error("Sessione scaduta: premi Riconnetti")}
 if(!r.ok)throw new Error("Errore Drive "+r.status);return r}
async function gEnsureFolder(){if(gFolder)return gFolder;
 const r=await gApi("https://www.googleapis.com/drive/v3/files?fields=files(id)&q="+encodeURIComponent("name='"+G_DIR+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"));
 const j=await r.json();
 if(j.files&&j.files[0])gFolder=j.files[0].id;
 else{const c=await gApi("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:G_DIR,mimeType:"application/vnd.google-apps.folder"})});gFolder=(await c.json()).id}
 return gFolder}
async function gFind(){if(gFile)return gFile;const f=await gEnsureFolder();
 const r=await gApi("https://www.googleapis.com/drive/v3/files?fields=files(id)&q="+encodeURIComponent("name='"+G_FILE+"' and '"+f+"' in parents and trashed=false"));
 const j=await r.json();gFile=j.files&&j.files[0]?j.files[0].id:null;return gFile}
async function gPush(){if(ls("spese_sync")!=="1"||!gClient)return;if(!S._ts)S._ts=Date.now();
 const body=JSON.stringify(S),id=await gFind();
 if(id){await gApi("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"content-type":"application/json"},body})}
 else{const bd="spese"+uid(),meta=JSON.stringify({name:G_FILE,parents:[gFolder]});
  const r=await gApi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"content-type":"multipart/related; boundary="+bd},body:"--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+meta+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--"});
  gFile=(await r.json()).id}}
async function gPull(){const id=await gFind();let remote=null;
 if(id){const r=await gApi("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media");remote=await r.json()}
 const first=ls("spese_suid")!==gEmail,local=S.exp.length||S.rec.length||S.acc.cash||S.acc.bank;let useRemote=false;
 if(remote){useRemote=first&&local?confirm("Su Drive ci sono già dei dati.\nOK = usa quelli di Drive (sostituisce i dati di questo dispositivo)\nAnnulla = carica i dati di questo dispositivo su Drive"):(remote._ts||0)>(S._ts||0);
  if(useRemote){S=Object.assign(blank(),remote);persist()}}
 try{localStorage.setItem("spese_suid",gEmail)}catch(e){}
 if(!useRemote&&(!remote||(S._ts||0)!==(remote._ts||0)))await gPush();
 return useRemote}
async function gConnect(prompt){await gAuth(prompt);
 try{const r=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{authorization:"Bearer "+gTok}});gEmail=(await r.json()).email||"Google"}catch(e){gEmail="Google"}
 try{localStorage.setItem("spese_sync","1")}catch(e){}
 gSt="";return gPull()}
async function gInit(){
 if(!G_CLIENT_ID){if(ls("spese_sync")==="1")runRec();return}
 try{await loadScript("https://accounts.google.com/gsi/client");
  gClient=google.accounts.oauth2.initTokenClient({client_id:G_CLIENT_ID,scope:G_SCOPE,callback:r=>gCb(r),error_callback:e=>gEb(e)});
  if(ls("spese_sync")==="1"){try{await gConnect("")}catch(e){gSt="Sessione scaduta: premi Riconnetti"}}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&gTok&&Date.now()<gExp)gPull().then(c=>c&&render()).catch(()=>{})})
 }catch(e){msg="⚠️ "+e.message}
 if(gFirst){gFirst=false;runRec()}render()}

 gTok=null;gFile=null;gFolder=null;gEmail="";gSt="";try{localStorage.removeItem("spese_sync");localStorage.removeItem("spese_suid")}catch(e){}msg="Disconnesso: i dati restano in questo browser";render()}

gInit();
render();
